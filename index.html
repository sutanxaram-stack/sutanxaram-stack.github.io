<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardião Anti-Golpes — Ativação Oficial</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1120;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #131c31;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        color: #cbd5e1;
        line-height: 1.5;
        margin: 0 0 22px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        padding: 14px 18px;
        border-radius: 12px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
      }
      .hint {
        margin-top: 14px;
        margin-bottom: 0;
        font-size: 12px;
        color: #94a3b8;
      }
      .done-msg {
        font-size: 16px;
        font-weight: 600;
        color: #86efac;
        margin: 12px 0 0;
      }
    </style>
  </head>
  <body>
    <main id="card-root" class="card">
      <h1>Guardião Anti-Golpes</h1>
      <p id="status-desc">
        Redirecionando automaticamente para o aplicativo Guardião Anti-Golpes...
      </p>
      <a id="open-app-btn" class="btn" href="guardiao://instalar">
        Abrir no Guardião Anti-Golpes
      </a>
      <p id="status-hint" class="hint">
        Se o aplicativo não abrir em instantes, toque no botão azul acima.
      </p>
    </main>
    <script>
      (function () {
        var qs = window.location.search || "";
        var target = "guardiao://instalar" + qs;
        var btn = document.getElementById("open-app-btn");
        var replaced = false;

        if (btn) {
          btn.setAttribute("href", target);
        }

        function tryCloseAndReplace() {
          try {
            window.open("", "_self");
          } catch (_) {}
          try {
            window.close();
          } catch (_) {}

          if (replaced) return;
          replaced = true;

          var root = document.getElementById("card-root");
          if (root) {
            root.innerHTML =
              '<h1>Guardião Anti-Golpes</h1><p class="done-msg">Proteção ativada! Você já pode fechar esta página.</p>';
          }
        }

        if (btn) {
          btn.addEventListener("click", function () {
            setTimeout(tryCloseAndReplace, 250);
          });
        }

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            tryCloseAndReplace();
          }
        });
        window.addEventListener("pagehide", tryCloseAndReplace);

        try {
          window.location.href = target;
        } catch (_) {}

        setTimeout(tryCloseAndReplace, 450);
      })();
    </script>
  </body>
</html>
